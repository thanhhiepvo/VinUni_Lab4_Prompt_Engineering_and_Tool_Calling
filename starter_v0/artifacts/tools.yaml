# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Ask the user for missing information such as Twitter account names, URLs, time periods, or confirmation before proceeding. Use standard question templates for consistency (see system prompt for templates)."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Fetch recent posts from a specific Twitter account. Requires the exact lowercase screenname (handle) without the '@' symbol (e.g. 'elonmusk' or 'sama'). Convert well-known person names to handles (e.g., 'Sam Altman' -> 'sama', 'Elon Musk' -> 'elonmusk', 'Andrej Karpathy' -> 'karpathy'). Do NOT use for keyword/topic search; use social_search instead."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản Twitter (screenname/handle) viết liền, không chứa ký tự '@'"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Search social media posts by keyword or topic. Use this for tweets about a subject, not for a specific account."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Sắp xếp theo mới nhất hoặc phổ biến"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin trên internet."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]

  - name: fetch
    description: "Read content from a specific URL. Only use when the user provides an explicit URL; ask for the URL first if the user says 'this article' or 'bài viết này'."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "URL cụ thể"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Publish a Telegram message only when the user explicitly asks to send or post. Use confirmed=true only after the user has explicitly requested publishing; otherwise clarify first."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận"}
      required: [text]

  - name: policy
    description: "Tìm trong tài liệu nội bộ."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Nhóm"}
        top_k: {type: integer, default: 3, description: "Số mục"}
      required: [query]

  - name: papers
    description: "Tìm bài báo khoa học."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

  - name: paper_text
    description: "Lấy nội dung text của một bài báo."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "ID hoặc địa chỉ"}
        max_pages: {type: integer, default: 5, description: "Số trang"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự"}
      required: [arxiv_url]

  - name: audit_eval
    description: "Analyze a run JSON file and summarize failures by type, routing mismatches, and argument errors. Use this to diagnose eval failures and guide prompt/tool tuning."
    parameters:
      type: object
      properties:
        run_json_path: {type: string, default: "", description: "Path to a run/*.json file (e.g., runs/v0_B_base_openai_20260602T142654960548.json)"}
        failure_types: {type: array, default: [], items: {type: string}, description: "Optional filter by failure types (e.g., [\"missing_info\", \"wrong_tool\"])"}
      required: [run_json_path]

  - name: compare_runs
    description: "Compare two eval run JSON files to show improvements, which cases were fixed, and how failure types shifted. Use this to quantify prompt/tool changes."
    parameters:
      type: object
      properties:
        run1_path: {type: string, default: "", description: "Path to first run/*.json file (baseline)"}
        run2_path: {type: string, default: "", description: "Path to second run/*.json file (to compare)"}
      required: [run1_path, run2_path]

  - name: batch_eval
    description: "Run eval.py with multiple configurations and generate a comparison matrix. Use this to test multiple prompt versions or model providers simultaneously."
    parameters:
      type: object
      properties:
        configs: {type: array, default: [], items: {type: object}, description: "List of config objects, each with: name, system_prompt_path, tools_yaml_path, provider, eval_data"}
      required: [configs]

  - name: resolve_twitter_handle
    description: "Convert person names to Twitter handles. Maps 'Sam Altman' → @samaltman, 'Elon Musk' → @elonmusk, etc. Use this before calling timeline to ensure correct handle lookups."
    parameters:
      type: object
      properties:
        person_reference: {type: string, default: "", description: "Person name, nickname, or handle to resolve (e.g., 'Sam Altman', 'Elon', '@samaltman')"}
        context: {type: string, default: "", description: "Optional context to disambiguate (e.g., 'in crypto context' or 'in AI context')"}
      required: [person_reference]
